name: Rust checks
on:
  pull_request:
    branches:
      - master
jobs:
  build:
    name: Build Crate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
  clippy:
    name: Run Clippy on Crate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Run clippy
      run: cargo clippy --verbose
  