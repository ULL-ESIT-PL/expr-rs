[package]
name = "expr"
version = "0.1.0"
authors = ["Mats Kindahl <mats.kindahl@gmail.com>", "Casiano Rodriguez-Leon <crguezl@ull.edu.es"]
description = "Example of Recursive descent expression parser used for teaching."
documentation = "http://docs.rs/expr-rs"
repository = "https://github.com/mkindahl/expr-rs"
license = "Apache-2.0"
keywords = ["expression", "parser"]
edition = "2024"

include = [
  "Cargo.toml",
  "LICENSE",
  "src/**/*",
  "examples/**/*"
]

[dev-dependencies]
criterion = "~0.3"
matches = "~0.1"

[[bench]]
name = "simple"
path = "benches/simple.rs"
harness = false

[[test]]
name = "evaluation"
path = "tests/evaluation.rs"

[[test]]
name = "parsing"
path = "tests/parsing.rs"
